<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/project.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

  {% include head-custom.html %}
</head>

<body class="project-page-body">

  <div class="project-layout">

    <header class="project-header">

      <a href="{{ "/" | relative_url }}" class="project-name">
        Juan Rafael Moreno
      </a>

      <p>
        Cyber Security &amp; Digital Forensics
      </p>

    </header>


    <nav class="project-nav">

      <a href="{{ "/about/" | relative_url }}">
        About
      </a>

      <a href="{{ "/blog/" | relative_url }}">
        Blog
      </a>

      <a href="{{ "/contacts/" | relative_url }}">
        Contact
      </a>

    </nav>


    <main class="project-content">

      {{ content }}

    </main>


    <footer class="project-footer">

      <a href="{{ "/portfolio/" | relative_url }}">
        ← Back to Portfolio
      </a>

    </footer>

  </div>

</body>
</html>
